<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTarif DZ - الحاسبة الشاملة للسيارات في الجزائر</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --result-bg: #f8fafc;
            --border-color: #cbd5e1;
            --accent-color: #e11d48;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 22px;
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-card {
            margin-top: 24px;
            background: var(--result-bg);
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            display: none;
        }

        .result-card h3 {
            margin-top: 0;
            font-size: 16px;
            color: #1e293b;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .total-box {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #cbd5e1;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: var(--accent-color);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚗 AutoTarif DZ</h2>
        <span class="badge">PRO Edition</span>
    </div>
    
    <div class="form-group">
        <label>سعر السيارة في الخارج (€):</label>
        <input type="number" id="carPrice" placeholder="مثال: 14000">
    </div>

    <div class="form-group">
        <label>سعة المحرك ونوعه:</label>
        <select id="engineType">
            <option value="small-petrol">بنزين أقل من 1.8L (إعفاء 80% جمركي)</option>
            <option value="large-petrol">بنزين أكبر من 1.8L (عادي)</option>
            <option value="diesel">ديزل (مازوت) بجميع السعات</option>
        </select>
    </div>

    <div class="form-group">
        <label>القوة الجبائية (الخيول الإدارية - أحصنة):</label>
        <select id="fiscalPower">
            <option value="low">أقل من 7 أحصنة (رسم البطاقة الرمادية مخفض)</option>
            <option value="high">8 أحصنة فما فوق</option>
        </select>
    </div>

    <div class="form-group">
        <label>سعر صرف اليورو في السوق السوداء (دج):</label>
        <input type="number" id="sqarRate" value="276">
    </div>

    <button onclick="calculateTarif()">احسب التكلفة الكاملة ⚡</button>

    <div class="result-card" id="resultBox">
        <h3>📊 تفاصيل التكلفة التقديرية:</h3>
        <div class="result-item">
            <span>💵 سعر السكوار:</span>
            <strong id="resSqar">0 دج</strong>
        </div>
        <div class="result-item">
            <span>🏛️ رسوم الجمركة (رسمي):</span>
            <strong id="resCustoms">0 دج</strong>
        </div>
        <div class="result-item">
            <span>📄 رسم البطاقة الرمادية:</span>
            <strong id="resCarteGrise">0 دج</strong>
        </div>
        <div class="total-box">
            <span>💰 التكلفة الإجمالية الصافية:</span>
            <span id="resTotal">0 دج</span>
        </div>
    </div>

    <div class="footer-note">
        تطبيق خاص بالسوق الجزائري • تم تطويره بحب 🇩🇿
    </div>
</div>

<script>
function calculateTarif() {
    let priceEuro = parseFloat(document.getElementById('carPrice').value);
    let engine = document.getElementById('engineType').value;
    let fiscalPower = document.getElementById('fiscalPower').value;
    let sqarRate = parseFloat(document.getElementById('sqarRate').value);
    
    if (!priceEuro || priceEuro <= 0) {
        alert("الرجاء إدخال سعر صحيح للسيارة باليورو");
        return;
    }

    let carPriceDZD = priceEuro * sqarRate;
    let officialRate = 151;
    let baseCustomsValue = priceEuro * officialRate;
    let customsFees = 0;

    // حساب الجمارك حسب القوانين
    if (engine === 'small-petrol') {
        customsFees = baseCustomsValue * 0.12; // تخفيض 80% تقريباً من الرسوم الأساسية
    } else if (engine === 'large-petrol') {
        customsFees = baseCustomsValue * 0.45; 
    } else {
        customsFees = baseCustomsValue * 0.55; // الديزل
    }

    // تقدير رسوم البطاقة الرمادية والقسيمة
    let carteGrise = (fiscalPower === 'low') ? 15000 : 35000;

    let totalCost = carPriceDZD + customsFees + carteGrise;

    document.getElementById('resSqar').innerText = carPriceDZD.toLocaleString() + " دج";
    document.getElementById('resCustoms').innerText = Math.round(customsFees).toLocaleString() + " دج";
    document.getElementById('resCarteGrise').innerText = carteGrise.toLocaleString() + " دج";
    document.getElementById('resTotal').innerText = Math.round(totalCost).toLocaleString() + " دج";
    
    let resBox = document.getElementById('resultBox');
    resBox.style.display = 'block';
    resBox.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
